<html>
<head>
  <meta charset="utf-8">
  <title>Espacio 1 - Helado y Ritmo Cromático</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Cielo celeste cremita y base beige cremita -->
    <a-sky color="#DCEEF2"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="12" color="#F2E6D5"></a-plane>

    <!-- Modelado propio: helado -->
    <a-entity gltf-model="pieza1.glb" position="0 0 -4" rotation="0 180 0" scale="1 1 1"></a-entity>

    <!-- Esferas alrededor del helado con los mismos 3 colores (crema, rosa y chocolate) -->
    <a-sphere position="-2.2 0.45 -3.6" radius="0.45" color="#E89BAE"></a-sphere>
    <a-sphere position="-1.4 1.15 -4.8" radius="0.35" color="#EFE6D5"></a-sphere>
    <a-sphere position="-2.6 1.35 -4.3" radius="0.3" color="#6E4730"></a-sphere>

    <a-sphere position="2.2 0.45 -3.6" radius="0.45" color="#6E4730"></a-sphere>
    <a-sphere position="1.4 1.15 -4.8" radius="0.35" color="#E89BAE"></a-sphere>
    <a-sphere position="2.6 1.35 -4.3" radius="0.3" color="#EFE6D5"></a-sphere>
  </a-scene>
</body>
</html>
